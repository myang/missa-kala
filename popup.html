<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missa Kala - Fish Finder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🐟 Missa Kala</h1>
      <p class="subtitle">Find today's fish menu</p>
    </header>

    <div class="controls">
      <button id="checkMenus" class="btn-primary">Check All Restaurants</button>
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>Checking menus...</span>
      </div>
    </div>

    <div id="results" class="results"></div>

    <footer>
      <p class="timestamp" id="lastChecked"></p>
      <div class="settings-toggle">
        <a href="#" id="toggleSettings">Settings</a>
      </div>
      <div id="settings" class="settings hidden">
        <label for="apiKey">Gemini API Key (<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">get free key</a>)</label>
        <div class="api-key-row">
          <input type="password" id="apiKey" placeholder="AIza..." />
          <button id="saveApiKey" class="btn-small">Save</button>
        </div>
        <p class="settings-hint" id="apiKeyStatus">Using keyword fallback (no API key)</p>
      </div>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
